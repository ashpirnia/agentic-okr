[project]
name = "agentic-okr"
version = "0.1.0"
description = "OKRs as code: a machine-readable goal spec, plus the agent architecture that keeps AI work pointed at it."
readme = "README.md"
authors = [
    { name = "Ash Pirnia", email = "ash.pirnia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
# The facilitation agent. Kept optional so the schema, loader, validator and
# CLI stay installable without an API key or an Anthropic account. See ADR-0004.
agent = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
okr = "agentic_okr.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax for target-version)
    "B",    # flake8-bugbear (likely bugs, e.g. mutable default args)
    "SIM",  # flake8-simplify (redundant code patterns)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
